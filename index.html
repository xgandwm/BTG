<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文字框图片生成器</title>
<style>
  :root{
    /* 薄荷蓝只保留少量强调：Logo、滑块、聚焦环、主按钮 */
    --mint-300:#6fe3d2; --mint-400:#2dd4bf; --mint-500:#14b8a6; --mint-600:#0d9488;
    --bg:#ffffff; --card:#ffffff; --soft:#f5f6f8; --line:#e5e8ec;
    --ink:#1f2329; --ink-2:#6b7280;
    --grid:#f1f2f4; --grid-bg:#ffffff;      /* 透明棋盘格 */
    --thumb:#ffffff; --scroll:#dfe2e6;
    --shadow:0 12px 28px -22px rgba(17,24,39,.4);
    --shadow-lg:0 22px 48px -34px rgba(17,24,39,.45);
    color-scheme:light;
  }
  /* ---- 夜间模式 ---- */
  [data-theme=dark]{
    --mint-300:#7ff0e2; --mint-400:#2dd4bf; --mint-500:#14b8a6; --mint-600:#0f9c8e;
    --bg:#14171a; --card:#1c2024; --soft:#23282e; --line:#2b3037;
    --ink:#e8ebef; --ink-2:#9aa4af;
    --grid:#2b3037; --grid-bg:#20252a;
    --thumb:#e8ebef; --scroll:#3a4048;
    --shadow:0 12px 28px -22px rgba(0,0,0,.9);
    --shadow-lg:0 22px 48px -34px rgba(0,0,0,.9);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); background:var(--bg);
    font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  }
  .app{display:flex; min-height:100vh}

  /* ---- 预览区 ---- */
  .preview{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:34px 28px; gap:16px; min-width:0;
  }
  .preview-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
  .chip{
    display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    color:var(--ink-2); background:var(--card); border:1px solid var(--line);
    padding:5px 13px; border-radius:99px; box-shadow:var(--shadow);
  }
  .chip::before{
    content:''; width:7px; height:7px; border-radius:50%;
    background:var(--mint-400); box-shadow:0 0 0 3px rgba(45,212,191,.22);
  }
  .info{
    font-size:12px; color:var(--ink-2); background:var(--card);
    border:1px solid var(--line); padding:5px 13px; border-radius:99px;
    font-variant-numeric:tabular-nums; box-shadow:var(--shadow);
  }
  .stage{
    padding:14px; border-radius:22px; max-width:100%; display:flex;
    background:var(--card); border:1px solid var(--line);
    box-shadow:var(--shadow-lg);
  }
  .board{
    background-image:
      linear-gradient(45deg,var(--grid) 25%,transparent 25%,transparent 75%,var(--grid) 75%),
      linear-gradient(45deg,var(--grid) 25%,transparent 25%,transparent 75%,var(--grid) 75%);
    background-size:18px 18px; background-position:0 0,9px 9px; background-color:var(--grid-bg);
    border-radius:13px; padding:10px; display:flex; max-width:100%;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  canvas{display:block; max-width:100%; height:auto}

  /* ---- 右侧面板 ---- */
  .panel{
    width:352px; flex:none; padding:20px 16px 36px; overflow:auto; max-height:100vh;
    background:var(--bg); border-left:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px; margin:2px 4px 18px}
  .logo{
    width:42px; height:42px; border-radius:13px; flex:none; display:grid; place-items:center;
    background:linear-gradient(135deg,#7ff0e2 0%,#14b8a6 58%,#0d9488 100%);
    box-shadow:0 12px 22px -12px rgba(13,148,136,.9);
  }
  .logo i{
    width:21px; height:13px; display:block; position:relative;
    border:2px solid rgba(255,255,255,.95); border-radius:5px;
  }
  .logo i::after{
    content:''; position:absolute; left:3px; bottom:-7px;
    border:4px solid transparent; border-top:5px solid rgba(255,255,255,.95);
  }
  .brand h1{font-size:17px; margin:0; letter-spacing:.3px; color:var(--ink)}
  .brand p{margin:3px 0 0; font-size:12px; color:var(--ink-2)}

  /* 主题切换：亮色显示月牙（点一下进夜间），暗色显示太阳 */
  .theme-btn{
    margin-left:auto; width:34px; height:34px; flex:none; padding:0;
    border-radius:11px; border:1px solid var(--line); background:var(--soft);
    color:var(--ink-2); display:grid; place-items:center; cursor:pointer; box-shadow:none;
  }
  .theme-btn:hover{background:var(--card)}
  .theme-btn i{
    width:13px; height:13px; border-radius:50%; display:block;
    background:transparent; box-shadow:inset 5px -3px 0 1px currentColor;
  }
  [data-theme=dark] .theme-btn i{
    background:currentColor; box-shadow:0 0 0 3px rgba(154,164,175,.22);
  }

  .group{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 13px 14px; margin-bottom:12px;
  }
  .gt{
    display:flex; align-items:center; gap:8px; margin:2px 0 10px;
    font-size:12px; font-weight:800; color:var(--ink); letter-spacing:1px;
  }
  .gt::before{
    content:''; width:3px; height:13px; border-radius:2px;
    background:linear-gradient(var(--mint-300),var(--mint-500));
  }
  .row{display:flex; align-items:center; gap:10px; margin:9px 0}
  .row>label{flex:none; width:72px; color:var(--ink-2); font-size:13px}
  .row input[type="text"], .row select, .row textarea{min-width:0}   /* 允许收缩，防止把行尾按钮挤出卡片 */
  .row .val{
    flex:none; min-width:48px; text-align:center; font-size:12px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:7px;
    padding:2px 6px; font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    flex:1; min-width:0; height:6px; border-radius:99px; outline:none; cursor:pointer;
    -webkit-appearance:none; appearance:none;
    background:linear-gradient(90deg,var(--mint-400) 0 var(--fill,50%),var(--soft) var(--fill,50%) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%; cursor:pointer;
    background:var(--thumb); border:3px solid var(--mint-500);
    box-shadow:0 3px 8px -2px rgba(13,148,136,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; cursor:pointer;
    background:var(--thumb); border:3px solid var(--mint-500);
  }
  input[type=number], select, textarea{
    width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--ink); font:inherit; outline:none; transition:.15s;
  }
  input[type=number]:focus, select:focus, textarea:focus{
    border-color:var(--mint-400); background:var(--card);
    box-shadow:0 0 0 3px rgba(45,212,191,.18);
  }
  input[type=file]{font-size:12px; color:var(--ink-2)}
  textarea{resize:vertical; min-height:82px; line-height:1.6}
  input[type=color]{
    width:42px; height:30px; padding:2px; border:1px solid var(--line);
    border-radius:9px; background:var(--card); cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:7px}
  .chk{
    display:flex; align-items:center; gap:7px; color:var(--ink-2);
    font-size:13px; cursor:pointer; user-select:none;
  }
  .chk input{accent-color:var(--mint-500); width:15px; height:15px}
  .seg{
    display:flex; gap:4px; padding:3px; width:100%; border-radius:11px;
    background:var(--soft); border:1px solid var(--line);
  }
  .seg label{flex:1; cursor:pointer; border-radius:8px; overflow:hidden}
  .seg input{display:none}
  .seg span{display:block; text-align:center; padding:6px 0; font-size:13px; color:var(--ink-2)}
  .seg input:checked + span{
    background:var(--card); color:var(--ink); font-weight:700;
    box-shadow:0 2px 8px -5px rgba(17,24,39,.5);
  }
  .btns{display:flex; gap:10px; margin-top:12px}
  button{
    flex:1; padding:11px 12px; border-radius:11px; border:1px solid transparent;
    font:inherit; font-weight:700; cursor:pointer; color:#fff; transition:.15s;
    background:linear-gradient(135deg,#43e0cd,#0d9488);
    box-shadow:0 10px 20px -12px rgba(13,148,136,.9);
  }
  button:hover{filter:brightness(1.05); transform:translateY(-1px)}
  button.ghost{background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:none}
  button.ghost:hover{background:var(--soft)}
  button:active{transform:translateY(1px)}
  .hint{
    font-size:12px; color:var(--ink-2); background:var(--soft);
    border:1px solid var(--line); border-radius:9px;
    padding:7px 9px; margin-top:10px; line-height:1.5;
  }
  .panel::-webkit-scrollbar{width:10px}
  .panel::-webkit-scrollbar-track{background:transparent}
  .panel::-webkit-scrollbar-thumb{
    background:var(--scroll); border-radius:99px;
    border:3px solid transparent; background-clip:content-box;
  }
  /* ---- 窄屏（竖屏手机）：预览吸顶，向下翻参数时预览始终可见 ---- */
  @media (max-width:900px){
    .app{flex-direction:column}
    .preview{
      position:sticky; top:0; z-index:6;
      padding:10px 12px; gap:8px;
      background:var(--bg);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);
      box-shadow:0 12px 24px -20px rgba(17,24,39,.8);
    }
    .stage{padding:8px; border-radius:16px; box-shadow:none}
    .board{padding:8px; border-radius:10px}
    canvas{max-height:38vh; object-fit:contain}  /* 限制预览高度，比例由 object-fit 保证 */
    .panel{
      width:100%; border-left:none; border-top:none;
      max-height:none; box-shadow:none; padding-top:14px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <section class="preview">
    <div class="preview-head">
      <span class="chip">实时预览</span>
      <span class="info" id="info"></span>
      <button type="button" class="ghost" id="btnSelBox" style="margin-left:auto; padding:4px 10px; font-size:12px">隐藏辅助框</button>
    </div>
    <div class="stage"><div class="board"><canvas id="cv"></canvas></div></div>
  </section>

  <aside class="panel">
    <div class="brand">
      <div class="logo"><i></i></div>
      <div>
        <h1>文字框图片生成器</h1>
        <p>透明背景 · 横竖排 · 气泡小角 · 圆框</p>
      </div>
      <button class="theme-btn" id="btnTheme" type="button" title="切换夜间模式" aria-label="切换夜间模式"><i></i></button>
    </div>

    <div class="group">
      <div class="gt">模板</div>
      <div class="row">
        <label>名称</label>
        <input type="text" id="tplName" placeholder="例如：漫画气泡 A" style="flex:1">
        <button type="button" id="btnTplSave" style="flex:none; padding:8px 14px">保存</button>
      </div>
      <div class="row">
        <label>已存</label>
        <select id="tplList" style="flex:1"></select>
        <button type="button" id="btnTplApply" class="ghost" style="flex:none; padding:8px 12px">应用</button>
        <button type="button" id="btnTplDel" class="ghost" style="flex:none; padding:8px 12px">删除</button>
      </div>
    </div>

    <div class="group">
      <div class="gt">文本</div>
      <textarea id="text" placeholder="输入文字，回车可手动换行">春风又绿江南岸
明月何时照我还</textarea>
      <div class="row" style="margin-top:8px">
        <label>排列方向</label>
        <div class="seg">
          <label><input type="radio" name="direction" value="horizontal" checked><span>横向</span></label>
          <label><input type="radio" name="direction" value="vertical"><span>竖向</span></label>
        </div>
      </div>
      <div class="row" id="rowColOrder">
        <label>列顺序</label>
        <select id="colOrder">
          <option value="rtl">从右到左</option>
          <option value="ltr">从左到右</option>
        </select>
      </div>
      <div class="row" id="rowPunct">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="rotatePunct" checked> 竖排标点旋转</label>
      </div>
    </div>

    <div class="group">
      <div class="gt">字体</div>
      <select id="fontFamily">
        <!-- 每项都带通用族回退：桌面用原字体，安卓/缺少该字体时自动落到系统默认 -->
        <option value='"Microsoft YaHei","Noto Sans CJK SC",sans-serif'>微软雅黑</option>
        <option value='"PingFang SC","Noto Sans CJK SC",sans-serif'>苹方</option>
        <option value='SimHei,"Heiti SC","Noto Sans CJK SC",sans-serif'>黑体</option>
        <option value='SimSun,"Songti SC","Noto Serif CJK SC",serif'>宋体</option>
        <option value='KaiTi,STKaiti,"Noto Serif CJK SC",serif'>楷体</option>
        <option value='STKaiti,KaiTi,"Noto Serif CJK SC",serif'>华文楷体</option>
        <option value='FangSong,"Noto Serif CJK SC",serif'>仿宋</option>
        <option value='DengXian,"Noto Sans CJK SC",sans-serif'>等线</option>
        <option value='"Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC",serif'>思源宋体</option>
        <option value='"Source Han Sans SC","Noto Sans SC","Noto Sans CJK SC",sans-serif'>思源黑体</option>
        <option value='"Noto Sans CJK SC","Noto Sans SC",sans-serif'>Noto 黑体（安卓通用）</option>
        <option value='"Noto Serif CJK SC","Noto Serif SC",serif'>Noto 宋体（安卓通用）</option>
        <option value='sans-serif'>系统默认（无衬线）</option>
        <option value='serif'>系统衬线（宋体风）</option>
        <option value='monospace'>系统等宽</option>
        <option value='Arial,Helvetica,sans-serif'>Arial</option>
        <option value='"Times New Roman",Times,serif'>Times New Roman</option>
        <option value='Georgia,serif'>Georgia</option>
        <option value='Impact,Haettenschweiler,sans-serif'>Impact</option>
      </select>
      <div class="row">
        <label>自定义</label>
        <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" style="font-size:12px">
        <button type="button" id="btnFontRemove" class="ghost" style="flex:none; padding:6px 10px">移除</button>
      </div>
      <div class="row" style="margin-top:2px">
        <label>&nbsp;</label>
        <span style="font-size:12px; color:var(--ink-2)">上传的字体会自动保存到本机并加入上方列表，下次打开无需重新上传</span>
      </div>
      <div class="row">
        <label>字号</label>
        <input type="range" id="fontSize" min="8" max="160" step="1" value="48">
        <span class="val" id="fontSizeVal">48</span>
      </div>
      <div class="row">
        <label>字重</label>
        <select id="fontWeight">
          <option value="400">常规</option>
          <option value="700" selected>加粗</option>
        </select>
      </div>
      <div class="row">
        <label>颜色</label>
        <input type="color" id="color" value="#1f2329">
        <label class="chk"><input type="checkbox" id="shadow"> 阴影</label>
      </div>
      <div class="row">
        <label>阴影模糊</label>
        <input type="range" id="shadowBlur" min="0" max="60" step="1" value="12">
        <span class="val" id="shadowBlurVal">12</span>
      </div>
      <div class="row">
        <label>阴影色</label>
        <input type="color" id="shadowColor" value="#000000">
      </div>
    </div>

    <div class="group">
      <div class="gt">排版</div>
      <div class="row">
        <label>水平对齐</label>
        <select id="alignH">
          <option value="left">左</option>
          <option value="center" selected>居中</option>
          <option value="right">右</option>
        </select>
      </div>
      <div class="row">
        <label>垂直对齐</label>
        <select id="alignV">
          <option value="top">上</option>
          <option value="middle" selected>居中</option>
          <option value="bottom">下</option>
        </select>
      </div>
      <div class="row">
        <label>行 / 列距</label>
        <input type="range" id="lineHeight" min="0.6" max="3" step="0.05" value="1.3">
        <span class="val" id="lineHeightVal">1.30</span>
      </div>
      <div class="row">
        <label>字间距</label>
        <input type="range" id="letterSpacing" min="-20" max="80" step="1" value="4">
        <span class="val" id="letterSpacingVal">4</span>
      </div>
      <div class="row">
        <label>内边距</label>
        <input type="range" id="padding" min="0" max="200" step="1" value="40">
        <span class="val" id="paddingVal">40</span>
      </div>
    </div>

    <div class="group">
      <div class="gt">画布</div>
      <div class="row">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="autoSize" checked> 自动适配文字</label>
      </div>
      <div class="row">
        <label>宽</label>
        <input type="number" id="width" min="16" max="4000" value="600" disabled>
        <label style="width:auto">高</label>
        <input type="number" id="height" min="16" max="4000" value="400" disabled>
      </div>
      <div class="row">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="bgTransparent" checked> 透明背景</label>
      </div>
      <div class="row">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
      <div class="row">
        <label>不透明度</label>
        <input type="range" id="bgOpacity" min="0" max="100" step="1" value="100">
        <span class="val" id="bgOpacityVal">100</span>
      </div>
      <div class="row">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="multiOn"> 连框模式（多气泡相连，重叠处无边框）</label>
      </div>
      <div id="multiDetails" style="display:none">
        <div class="row">
          <label>框</label>
          <select id="frameSel" style="flex:1"></select>
          <button type="button" id="btnFrameAdd" class="ghost" style="flex:none; padding:6px 10px">＋</button>
          <button type="button" id="btnFrameDel" class="ghost" style="flex:none; padding:6px 10px">－</button>
        </div>
        <div class="row">
          <label>位置</label>
          <input type="number" id="frameX" value="0" style="width:72px">
          <input type="number" id="frameY" value="0" style="width:72px">
          <span style="font-size:12px; color:var(--ink-2)">也可在预览中点选 / 拖动</span>
        </div>
        <div class="row" style="margin-top:2px">
          <label>&nbsp;</label>
          <span style="font-size:12px; color:var(--ink-2)">左侧所有参数（形状、文字、尾巴、样式）都只属于当前选中的框</span>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="gt">框形状</div>
      <div class="row">
        <label>形状</label>
        <select id="shape">
          <option value="rect" selected>圆角矩形</option>
          <option value="ellipse">椭圆（圆框）</option>
          <option value="wobbly">不规则（漫画手绘）</option>
          <option value="burst">内心独白（光球尖刺）</option>
          <option value="cloud">云朵（随机云边）</option>
          <option value="page">书页（不规则纸片）</option>
        </select>
      </div>
      <div class="row" id="rowWobble" style="display:none">
        <label>波动</label>
        <input type="range" id="wobbleAmp" min="2" max="40" step="1" value="14">
        <span class="val" id="wobbleAmpVal">14%</span>
      </div>
      <div class="row" id="rowSpikes" style="display:none">
        <label>尖角</label>
        <select id="spikeDir" style="flex:1">
          <option value="in" selected>向内凹陷</option>
          <option value="out">向外凸出</option>
        </select>
        <input type="range" id="spikes" min="0" max="8" step="1" value="4">
        <span class="val" id="spikesVal">4</span>
      </div>
      <div class="row" id="rowSpikeHalf" style="display:none">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="spikeHalf"> 半开描边（每根刺只描一侧）</label>
      </div>
      <div class="row" id="rowSeed" style="display:none">
        <label>样式</label>
        <button type="button" id="btnRandomWobble" class="ghost">随机一下</button>
        <span class="val" id="seedVal">#0</span>
      </div>
      <div class="row" id="rowRadius">
        <label>圆角</label>
        <input type="range" id="radius" min="0" max="200" step="1" value="16">
        <span class="val" id="radiusVal">16</span>
      </div>
      <div class="row">
        <label>粗细</label>
        <input type="range" id="borderWidth" min="0" max="40" step="1" value="6">
        <span class="val" id="borderWidthVal">6</span>
      </div>
      <div class="row">
        <label>颜色</label>

    <div class="group">
      <div class="gt">尾巴（气泡小角）</div>
      <div class="row">
        <label>&nbsp;</label>
        <label class="chk"><input type="checkbox" id="tailOn" checked> 显示尾巴</label>
      </div>
      <div id="tailDetails">
        <div class="row">
          <label>方向</label>
          <input type="range" id="tailAngle" min="0" max="359" step="1" value="45">
          <span class="val" id="tailAngleVal">45°</span>

          <label>长度</label>
          <input type="range" id="tailLen" min="0" max="300" step="1" value="80">
          <span class="val" id="tailLenVal">80</span>
        </div>
        <div class="row">
          <label>根部宽</label>
          <input type="range" id="tailWidth" min="2" max="240" step="1" value="34">

            <option value="curve" selected>弯尾</option>

      <div class="gt">导出</div>

          <option value="1">1x</option>
          <option value="2" selected>2x</option>

</div>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv');
  var customFontName = null;
  var wobbleSeed = (Math.random() * 4294967295) >>> 0;   // 不规则边框的随机种子

  // ---------- 上传字体的持久化：存 IndexedDB，启动时自动恢复并加入字体下拉 ----------
  var userFonts = {};                 // 字体名 -> FontFace
  var FONT_DB = 'btg-font-db', FONT_STORE = 'fonts', FONT_CUR_KEY = 'btg-font-current';

  function fontDB(){
    return new Promise(function(res, rej){
      if (!window.indexedDB){ rej(new Error('no indexedDB')); return; }
      var req = indexedDB.open(FONT_DB, 1);
      req.onupgradeneeded = function(){
        if (!req.result.objectStoreNames.contains(FONT_STORE)) req.result.createObjectStore(FONT_STORE);
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error || new Error('open failed')); };
    });
  }
  function fontSave(name, buf){
    return fontDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction(FONT_STORE, 'readwrite');
        tx.objectStore(FONT_STORE).put({ name: name, buf: buf, t: Date.now() }, name);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = function(){ rej(tx.error || new Error('put failed')); };
      });
    });
  }
  function fontDel(name){
    return fontDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction(FONT_STORE, 'readwrite');
        tx.objectStore(FONT_STORE).delete(name);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = function(){ rej(tx.error || new Error('del failed')); };
      });
    });
  }
  function fontAll(){
    return fontDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction(FONT_STORE, 'readonly');
        var req = tx.objectStore(FONT_STORE).getAll();
        req.onsuccess = function(){ res(req.result || []); };
        req.onerror = function(){ rej(req.error || new Error('get failed')); };
      });
    });
  }
  function fontVal(name){ return '"' + name + '"'; }
  function fontAddOption(name){
    var sel = $('fontFamily'), v = fontVal(name);
    for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === v) return;
    var o = document.createElement('option');
    o.value = v; o.textContent = name + '（已上传）';
    sel.appendChild(o);
  }
  function fontRemoveOption(name){
    var sel = $('fontFamily'), v = fontVal(name);
    for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === v){ sel.remove(i); return; }
  }
  function fontRegister(name, buf){
    var face = new FontFace(name, buf);
    return face.load().then(function(){
      if (userFonts[name]){ try { document.fonts.delete(userFonts[name]); } catch (e) {} }
      document.fonts.add(face);
      userFonts[name] = face;
      fontAddOption(name);
      return name;
    });
  }
  function selectFont(name){
    var sel = $('fontFamily');
    sel.value = fontVal(name);
    customFontName = name;
    try { localStorage.setItem(FONT_CUR_KEY, sel.value); } catch (e) {}
  }
  function fontRestore(){
    return fontAll().then(function(list){
      var jobs = (list || []).map(function(it){
        return fontRegister(it.name, it.buf).then(function(){}, function(){});
      });
      return Promise.all(jobs).then(function(){ return (list || []).length; });
    }).then(function(n){
      var cur = null;
      try { cur = localStorage.getItem(FONT_CUR_KEY); } catch (e) {}
      if (cur){
        $('fontFamily').value = cur;            // 字体已不存在时赋值无效，保持默认
        var nm = cur.replace(/^"|"$/g, '');
        customFontName = userFonts[nm] ? nm : null;
      }
      return n;
    }).catch(function(){ return 0; });
  }

  // ---------- 状态读取 ----------
  function num(id){ return parseFloat($(id).value); }
  function str(id){ return $(id).value; }
  function chk(id){ return $(id).checked; }
  function radio(name){
    var el = document.querySelector('input[name="'+name+'"]:checked');
    return el ? el.value : '';
  }

  function state(){
    return {
      text: str('text'),
      direction: radio('direction'),
      colOrder: str('colOrder'),
      rotatePunct: chk('rotatePunct'),
      fontFamily: str('fontFamily'),   // 上传的字体也会作为选项出现在下拉里
      fontSize: num('fontSize'),
      fontWeight: str('fontWeight'),
      color: str('color'),
      shadow: chk('shadow'),
      shadowBlur: num('shadowBlur'),
      shadowColor: str('shadowColor'),
      alignH: str('alignH'),
      alignV: str('alignV'),
      lineHeight: num('lineHeight'),
      letterSpacing: num('letterSpacing'),
      padding: num('padding'),
      autoSize: chk('autoSize'),
      width: num('width'),
      height: num('height'),
      bgTransparent: chk('bgTransparent'),
      bgColor: str('bgColor'),
      bgOpacity: num('bgOpacity') / 100,
      borderWidth: num('borderWidth'),
      borderColor: str('borderColor'),
      shape: str('shape'),
      spikeDir: str('spikeDir'),
      spikeHalf: chk('spikeHalf'),
      wobbleAmp: num('wobbleAmp'),
      spikes: num('spikes'),
      wobbleSeed: wobbleSeed,
      radius: num('radius'),
      tailOn: chk('tailOn'),
      tailAngle: num('tailAngle'),
      tailLen: num('tailLen'),
      tailWidth: num('tailWidth'),
      tailShape: str('tailShape'),
      tailCurl: num('tailCurl') / 100
    };
  }

  function fontOf(s){ return s.fontWeight + ' ' + s.fontSize + 'px ' + s.fontFamily; }

  // ---------- 排版 ----------
  // 横排：把文本按可用宽度折成多行；竖排：按可用高度折成多列
  function layout(ctx, s, maxW, maxH){
    var ls = s.letterSpacing;
    var vertical = s.direction === 'vertical';
    var minStep = s.fontSize * 0.35; // 竖排下给窄字符(i、l 等)一个最小步进，避免挤在一起
    var paragraphs = s.text.split('\n');
    var blocks = [];                 // 每项 {chars:[{ch,adv}], size:主方向长度}

    function advOf(ch){
      var w = ctx.measureText(ch).width;
      return (vertical ? Math.max(w, minStep) : w) + ls;
    }

    var limit = vertical ? maxH : maxW;
    var cur = [], curLen = 0;
    function flush(){
      blocks.push({ chars: cur, size: Math.max(0, curLen - ls) });
      cur = []; curLen = 0;
    }
    function widthOf(txt){
      var cs = Array.from(txt), w = 0;
      for (var i = 0; i < cs.length; i++) w += advOf(cs[i]);
      return cs.length ? w - ls : 0;
    }

    for (var p = 0; p < paragraphs.length; p++){
      var para = paragraphs[p];
      if (!para.length){ blocks.push({ chars: [], size: 0 }); continue; }

      // 横排按空格切成整词，避免英文被拆断；竖排逐字成列
      var tokens = vertical
        ? Array.from(para)
        : (para.match(/\s+|\S+/g) || []);

      for (var t = 0; t < tokens.length; t++){
        var tk = tokens[t];
        if (cur.length && curLen + widthOf(tk) > limit){
          flush();
          if (!vertical && /^\s+$/.test(tk)) continue; // 行首空白丢弃
        }
        var cs = Array.from(tk);
        for (var i = 0; i < cs.length; i++){
          var adv = advOf(cs[i]);
          if (cur.length && curLen + adv - ls > limit) flush(); // 超长词强行断行
          cur.push({ ch: cs[i], adv: adv });
          curLen += adv;
        }
      }
      flush();
    }

    var step = s.fontSize * s.lineHeight; // 行距（横排）/ 列距（竖排）
    var mainLen = 0, crossLen = 0;
    for (var b = 0; b < blocks.length; b++){
      var blk = blocks[b];
      mainLen += blk.chars.length ? step : step * 0.6; // 空行保留半行空白
      if (blk.size > crossLen) crossLen = blk.size;
    }
    return { blocks: blocks, step: step, mainLen: mainLen, crossLen: crossLen };
  }

  function contentSize(lo, s){
    // 返回内容区（不含 padding 与边框）宽高
    if (s.direction === 'vertical'){
      return { w: Math.max(0, Math.ceil(lo.mainLen)), h: Math.max(0, Math.ceil(lo.crossLen)) };
    }
    return { w: Math.max(0, Math.ceil(lo.crossLen)), h: Math.max(0, Math.ceil(lo.mainLen)) };
  }

  function measureCanvas(){
    var c = document.createElement('canvas');
    return c.getContext('2d');
  }

  // ---------- 尾巴（气泡小角）几何 ----------
  // 圆角矩形边界参数化：s 为顺时针弧长（从顶边左端 (x+r, y) 起算）。
  // pointAt(s) 给坐标；intersect(dx,dy) 给中心射线与真实边界（直线段+四角弧）的交点及其参数 s
  function rrBoundary(box, radius){
    var hw = box.w / 2, hh = box.h / 2;
    var x = box.x, y = box.y, w = box.w, h = box.h;
    var r = Math.max(0, Math.min(radius, hw, hh));
    var sTop = Math.max(0, w - 2 * r);
    var sSide = Math.max(0, h - 2 * r);
    var sArc = Math.PI * r / 2;
    var L = 2 * sTop + 2 * sSide + 4 * sArc;

    function pointAt(s){
      s = ((s % L) + L) % L;
      var a;
      if (s < sTop) return { x: x + r + s, y: y };                    // 顶边 →
      s -= sTop;
      if (s < sArc){ a = -Math.PI / 2 + s / r;                        // 右上弧 ↘
        return { x: x + w - r + r * Math.cos(a), y: y + r + r * Math.sin(a) }; }
      s -= sArc;
      if (s < sSide) return { x: x + w, y: y + r + s };               // 右边 ↓
      s -= sSide;
      if (s < sArc){ a = s / r;                                       // 右下弧 ↙
        return { x: x + w - r + r * Math.cos(a), y: y + h - r + r * Math.sin(a) }; }
      s -= sArc;
      if (s < sTop) return { x: x + w - r - s, y: y + h };            // 底边 ←
      s -= sTop;
      if (s < sArc){ a = Math.PI / 2 + s / r;                         // 左下弧 ↖
        return { x: x + r + r * Math.cos(a), y: y + h - r + r * Math.sin(a) }; }
      s -= sArc;
      if (s < sSide) return { x: x, y: y + h - r - s };               // 左边 ↑
      s -= sSide;
      a = Math.PI + s / r;                                            // 左上弧 ↗
      return { x: x + r + r * Math.cos(a), y: y + r + r * Math.sin(a) };
    }

    function intersect(dx, dy){
      var cx = x + hw, cy = y + hh;
      var hw2 = hw - r, hh2 = hh - r;          // 角圆心构成的内缩矩形（判断直线段范围用）
      var adx = Math.max(1e-9, Math.abs(dx)), ady = Math.max(1e-9, Math.abs(dy));
      // 直线段在外接矩形的四条边上，先与外接矩形求交
      var tEx = hw / adx, tEy = hh / ady;
      var tE = Math.min(tEx, tEy);
      var px = cx + dx * tE, py = cy + dy * tE;
      var onSide = (tEx <= tEy) ? (Math.abs(py - cy) <= hh2 + 1e-6)   // 左/右边
                                : (Math.abs(px - cx) <= hw2 + 1e-6);  // 上/下边
      if (onSide){
        var sp;
        if (tEx <= tEy){
          sp = dx > 0 ? sTop + sArc + (py - (y + r))                        // 右边
                      : 2 * sTop + 3 * sArc + sSide + ((y + h - r) - py);   // 左边
        } else {
          sp = dy > 0 ? sTop + 2 * sArc + sSide + ((x + w - r) - px)        // 底边（自右向左）
                      : (px - (x + r));                                     // 顶边
        }
        return { x: px, y: py, s: ((sp % L) + L) % L };
      }
      // 交点在角区：与对应角圆求交，取落在弧段角度范围内的根
      var ox = cx + (dx > 0 ? hw2 : -hw2), oy = cy + (dy > 0 ? hh2 : -hh2);
      var fx = cx - ox, fy = cy - oy;
      var b = fx * dx + fy * dy;
      var c0 = fx * fx + fy * fy - r * r;
      var disc = Math.max(0, b * b - c0);
      var sq = Math.sqrt(disc);
      var a0, base;
      if (dy < 0){ if (dx >= 0){ a0 = -Math.PI / 2; base = sTop; } else { a0 = Math.PI; base = 2 * sTop + 3 * sArc + 2 * sSide; } }
      else       { if (dx >= 0){ a0 = 0; base = sTop + sArc + sSide; } else { a0 = Math.PI / 2; base = 2 * sTop + 2 * sArc + sSide; } }

      var cands = [];
      if (-b - sq > 1e-9) cands.push(-b - sq);
      if (-b + sq > 1e-9) cands.push(-b + sq);
      if (!cands.length) cands.push(Math.max(0, -b));   // 数值兜底
      var best = null;
      for (var i = cands.length - 1; i >= 0; i--){
        var t = cands[i];
        var ang = Math.atan2(cy + dy * t - oy, cx + dx * t - ox) - a0;
        while (ang < -1e-6) ang += Math.PI * 2;
        if (ang <= Math.PI / 2 + 1e-6){                 // 在弧段上
          var sp2 = base + r * Math.min(Math.max(ang, 0), Math.PI / 2);
          if (!best || t > best.t) best = { t: t, s: sp2 };  // 取沿射线更远的合法交点
        }
      }
      if (!best){                                       // 兜底：取外接矩形交点的参数
        best = { t: tE, s: 0 };
      }
      var fx2 = cx + dx * best.t, fy2 = cy + dy * best.t;
      return { x: fx2, y: fy2, s: ((best.s % L) + L) % L };
    }

    return { r: r, L: L, pointAt: pointAt, intersect: intersect };
  }

  // 椭圆边界：离散成折线并按累积弧长参数化，接口与 rrBoundary 一致
  function ellipseBoundary(box){
    var a = Math.max(0.5, box.w / 2), b = Math.max(0.5, box.h / 2);
    var cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    var N = 720;
    var px = new Array(N + 1), py = new Array(N + 1), cum = new Array(N + 1);
    px[0] = cx + a; py[0] = cy; cum[0] = 0;
    for (var i = 1; i <= N; i++){
      var th = i * 2 * Math.PI / N;
      px[i] = cx + a * Math.cos(th); py[i] = cy + b * Math.sin(th);
      cum[i] = cum[i - 1] + Math.hypot(px[i] - px[i - 1], py[i] - py[i - 1]);
    }
    var L = cum[N];

    function pointAt(s){
      s = ((s % L) + L) % L;
      var lo = 0, hi = N;
      while (lo < hi){
        var mid = (lo + hi + 1) >> 1;
        if (cum[mid] <= s) lo = mid; else hi = mid - 1;
      }
      if (lo >= N) return { x: px[N], y: py[N] };
      var seg = cum[lo + 1] - cum[lo];
      var f = seg > 1e-12 ? (s - cum[lo]) / seg : 0;
      return { x: px[lo] + (px[lo + 1] - px[lo]) * f, y: py[lo] + (py[lo + 1] - py[lo]) * f };
    }

    function intersect(dx, dy){
      var q = (dx * dx) / (a * a) + (dy * dy) / (b * b);
      var t = q > 1e-12 ? 1 / Math.sqrt(q) : 0;
      var qx = cx + dx * t, qy = cy + dy * t;
      var th = Math.atan2((qy - cy) / b, (qx - cx) / a);
      if (th < 0) th += 2 * Math.PI;
      var fi = th / (2 * Math.PI) * N;
      var i0 = Math.floor(fi) % N, i1 = (i0 + 1) % N, fr = fi - Math.floor(fi);
      var c0 = cum[i0], c1 = i1 === 0 ? L : cum[i1];
      return { x: qx, y: qy, s: ((c0 + (c1 - c0) * fr) % L + L) % L };
    }

    return { r: 0, L: L, pointAt: pointAt, intersect: intersect };
  }

  function boundaryOf(box, s){
    if (s.shape === 'ellipse') return ellipseBoundary(box);
    if (s.shape === 'wobbly') return polyBoundary(box, wobblyField(box, s));
    if (s.shape === 'burst') return polyBoundary(box, burstField(box, s));
    if (s.shape === 'cloud') return polyBoundary(box, cloudField(box, s));
    if (s.shape === 'page') return pageBoundary(box, s);
    return rrBoundary(box, s.radius);
  }

  // ---- 不规则（漫画手绘）边界 ----
  function mulberry32(seed){
    var t = seed >>> 0;
    return function(){
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 确定性随机场：基础椭圆 ×（平滑谐波噪声 + 若干高斯尖峰/凹口），同一种子结果完全一致
  // 尖峰方向由 s.spikeDir 决定：'in' 向内凹陷（默认），'out' 向外凸出
  function wobblyField(box, s){
    var a = Math.max(0.5, box.w / 2), b = Math.max(0.5, box.h / 2);
    var rnd = mulberry32(s.wobbleSeed);
    var H = 6, harm = [], i;
    for (i = 0; i < H; i++) harm.push({ k: 2 + Math.floor(rnd() * 9), ph: rnd() * Math.PI * 2, amp: rnd() });
    var spikes = [], n = Math.round(s.spikes);
    var dir = s.spikeDir === 'out' ? 1 : -1;
    for (i = 0; i < n; i++) spikes.push({ th: rnd() * Math.PI * 2, w: 0.10 + rnd() * 0.16, h: (0.55 + rnd() * 0.9) * dir });
    var amp = s.wobbleAmp / 100;

    function ratio(th){                       // 相对基础椭圆的缩放比例，与框尺寸无关
      var f = 1, nz = 0;
      for (var j = 0; j < H; j++) nz += harm[j].amp * Math.sin(harm[j].k * th + harm[j].ph);
      f += amp * 1.6 * (nz / H);
      for (j = 0; j < spikes.length; j++){
        var sp = spikes[j];
        var d = Math.abs((th - sp.th) % (2 * Math.PI));
        if (d > Math.PI) d = 2 * Math.PI - d;
        if (d < sp.w * 4) f += amp * sp.h * Math.exp(-(d * d) / (2 * sp.w * sp.w));
      }
      return Math.max(0.35, f);               // 凹陷最深不超过基础半径的 65%
    }
    // 先求最大外扩比例，再把基础椭圆按它缩小：轮廓峰值恰好贴住框边界，不会被画布裁掉
    var MR = 1;
    for (i = 0; i < 720; i++) MR = Math.max(MR, ratio(i * 2 * Math.PI / 720));
    function radius(th){
      var base = 1 / Math.sqrt(Math.pow(Math.cos(th) / a, 2) + Math.pow(Math.sin(th) / b, 2));
      return Math.max(1, base / MR * ratio(th));
    }
    return { cx: box.x + box.w / 2, cy: box.y + box.h / 2, radius: radius, ratio: ratio, N: 720, ratioMax: MR };
  }

  // ---- 内心独白（光球尖刺）----
  // 基础椭圆 + 均匀分布的细三角尖刺；每根刺长度带轻微随机（同种子可复现）
  function burstField(box, s){
    var a = Math.max(0.5, box.w / 2), b = Math.max(0.5, box.h / 2);
    var rnd = mulberry32(s.wobbleSeed);
    var NS = Math.max(8, Math.round(s.spikes));
    var amp = s.wobbleAmp / 100;
    var NB = Math.max(3, Math.round(NS / 4.5));   // 大突起数：大约每 4~5 根细刺一个大波
    var ph = rnd() * Math.PI * 2;                 // 大波相位（随种子变化）
    var lens = [];
    for (var i = 0; i < NS; i++) lens.push(0.85 + rnd() * 0.3);   // 细刺长度轻微参差

    function shape(th){
      var u = th * NS / (2 * Math.PI);
      var k = Math.floor(u), f = u - k;
      var tri = f < 0.5 ? f * 2 : (1 - f) * 2;    // 连续锯齿：相邻刺在谷点直接相接，无平台
      var big = 0.5 - 0.5 * Math.cos(NB * th + ph);  // 低频大突起 0..1
      var kk = ((k % NS) + NS) % NS;
      return (1 + amp * 0.9 * big) * (1 + amp * lens[kk] * tri);
    }
    var N = NS * 16;                              // 每齿 16 个采样点，刺尖精确落在采样点上
    var MR = 1;
    for (i = 0; i < N; i++) MR = Math.max(MR, shape(i * 2 * Math.PI / N));

    function radius(th){
      var base = 1 / Math.sqrt(Math.pow(Math.cos(th) / a, 2) + Math.pow(Math.sin(th) / b, 2));
      // 基础椭圆按 MR 收缩，最高尖刺的尖端恰好到达框边界
      return Math.max(1, base / MR * shape(th));
    }
    return { cx: box.x + box.w / 2, cy: box.y + box.h / 2, radius: radius, N: N, ratioMax: MR };
  }

  // ---- 云朵（随机云边）----
  // 若干圆形凸包沿基础椭圆排布，外轮廓取所有圆的包络：凸起是圆弧，交界处形成内凹角
  function cloudField(box, s){
    var a = Math.max(0.5, box.w / 2), b = Math.max(0.5, box.h / 2);
    var rnd = mulberry32(s.wobbleSeed);
    var NC = Math.max(4, Math.round(s.spikes));       // 云瓣数量
    var amp = Math.min(0.5, Math.max(0.03, s.wobbleAmp / 100));
    var N = 720, i;

    function ellipseR(th){
      return 1 / Math.sqrt(Math.pow(Math.cos(th) / a, 2) + Math.pow(Math.sin(th) / b, 2));
    }

    var lobes = [];
    for (i = 0; i < NC; i++){
      var th = i * 2 * Math.PI / NC + (rnd() - 0.5) * (2 * Math.PI / NC) * 0.25;
      var R0 = ellipseR(th);
      var half = R0 * Math.sin(Math.PI / NC);                // 相邻瓣心间距的一半
      // 瓣半径至少能覆盖到邻瓣（保证交叠出凹角），再叠加随机大小
      var rc = Math.max(amp * R0, half * 1.25) * (0.88 + rnd() * 0.26);
      // 瓣心内缩至少 rc/2：瓣的外露弧不超过半圆，凸起平缓不突出
      var R = Math.min(R0 * (1 - amp * 0.5), R0 - rc / 2);
      R = Math.max(R, R0 * 0.45);
      lobes.push({ th: th, R: R, rc: rc });
    }

    function raw(th){                                        // 该方向的包络距离
      var best = ellipseR(th);                               // 云体底：基础椭圆
      for (var j = 0; j < lobes.length; j++){
        var L = lobes[j];
        var proj = L.R * Math.cos(th - L.th);                // 瓣心在射线上的投影
        var disc = L.rc * L.rc - (L.R * L.R - proj * proj);  // 判别式（垂直距离²）
        if (disc > 0){
          var r = proj + Math.sqrt(disc);
          if (r > best) best = r;
        }
      }
      return best;
    }

    var MR = 1;                                              // 峰值比例：让最高云瓣贴住框
    for (i = 0; i < N; i++){
      var t = i * 2 * Math.PI / N;
      MR = Math.max(MR, raw(t) / ellipseR(t));
    }

    function radius(th){
      return Math.max(1, raw(th) / MR);
    }
    return { cx: box.x + box.w / 2, cy: box.y + box.h / 2, radius: radius, N: N, ratioMax: MR, lobes: lobes };
  }

  // ---- 书页（不规则纸片）----
  // 四角随机歪斜的四边形，每条边向内波动（轮廓始终在框内，画布无需外扩）；
  // pageMargin 是文字矩形的安全边距，保证文字不碰轮廓
  function pageMargin(s, w, h){
    return Math.max(4, Math.ceil(Math.min(w, h) * (s.wobbleAmp / 100) * 1.25));
  }
  function ptsInset(pts, inset){                 // 点列沿内法向收缩（顺时针轮廓，左法向即内法向）；负值外扩
    if (!inset) return pts;
    var n = pts.length - 1, out = [];
    for (var i = 0; i < n; i++){
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
      var ex = p2.x - p0.x, ey = p2.y - p0.y, l = Math.hypot(ex, ey) || 1;
      out.push({ x: p1.x - ey / l * inset, y: p1.y + ex / l * inset });
    }
    out.push(out[0]);
    return out;
  }
  function pagePts(box, s, inset){
    var TAU = Math.PI * 2;
    var rnd = mulberry32(s.wobbleSeed ^ 0x9e3779b9);
    var amp = Math.min(0.4, Math.max(0.01, s.wobbleAmp / 100));
    // 幅度预算：角偏移(≤0.5) + 波动(≤0.67) 叠加 ≤ margin 系数 1.25，文字不会被波及
    var m = Math.min(box.w, box.h) * amp * 0.7;          // 边缘最大内凹深度
    var fq = Math.max(1, Math.round(s.spikes));           // 抖动密度：每条边的主波数
    var H = 3, harm = [], i, wSum = 0;
    // 主谐波频率 = 密度，另加 fq±1 的弱次谐波做扰动：波数≈密度，密度每调 1 都能看出变化
    for (i = 0; i < H; i++){
      var kk = Math.max(1, fq + (i === 0 ? 0 : (i === 1 ? 1 : -1)));
      var ww = i === 0 ? 1 : (i === 1 ? 0.32 : 0.22);
      harm.push({ k: kk, ph: rnd() * TAU, w: ww });
      wSum += ww;
    }

    var cs = [
      { x: box.x, y: box.y }, { x: box.x + box.w, y: box.y },
      { x: box.x + box.w, y: box.y + box.h }, { x: box.x, y: box.y + box.h }
    ];
    var inA = [Math.PI / 4, Math.PI * 3 / 4, -Math.PI * 3 / 4, -Math.PI / 4];   // 各角内向基准角
    for (i = 0; i < 4; i++){
      var d = Math.min(box.w, box.h) * amp * 0.5 * (0.5 + rnd() * 0.5);
      var an = inA[i] + (rnd() - 0.5) * 0.9;
      cs[i].x += Math.cos(an) * d;
      cs[i].y += Math.sin(an) * d;
    }

    var pts = [], N = Math.max(22, Math.min(96, fq * 8));   // 采样点数随密度增加，避免锯齿
    var cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    for (i = 0; i < 4; i++){
      var c0 = cs[i], c1 = cs[(i + 1) % 4];
      var ex = c1.x - c0.x, ey = c1.y - c0.y, el = Math.hypot(ex, ey) || 1;
      var nx = -ey / el, ny = ex / el;                   // 左法向
      if (nx * (cx - c0.x - ex / 2) + ny * (cy - c0.y - ey / 2) < 0){ nx = -nx; ny = -ny; }
      for (var j = 0; j < N; j++){                       // 角点由下一条边的起点提供
        var t = j / N;
        var off = 0;
        for (var k = 0; k < H; k++) off += harm[k].w * Math.sin(harm[k].k * t * TAU + harm[k].ph + i * 1.7);
        // 波形线性映射到 0..m（负半波=轮廓贴边、正半波=内凹），波数不被翻倍，端点衰减到角点
        var depth = m * Math.sin(Math.PI * t) * (1 + off / wSum) / 2;
        pts.push({ x: c0.x + ex * t + nx * depth, y: c0.y + ey * t + ny * depth });
      }
    }
    pts.push(pts[0]);
    return ptsInset(pts, inset);
  }
  // 任意闭合点列 → 弧长参数化边界（供尾巴几何复用）
  function makePtsBoundary(pts, cx, cy){
    var N = pts.length - 1;
    var cum = new Array(N + 1); cum[0] = 0;
    for (var i = 1; i <= N; i++) cum[i] = cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    var L = cum[N];
    function pointAt(t){
      t = ((t % L) + L) % L;
      var lo = 0, hi = N;
      while (lo < hi){
        var mid = (lo + hi + 1) >> 1;
        if (cum[mid] <= t) lo = mid; else hi = mid - 1;
      }
      if (lo >= N) return { x: pts[N].x, y: pts[N].y };
      var seg = cum[lo + 1] - cum[lo];
      var fr = seg > 1e-12 ? (t - cum[lo]) / seg : 0;
      return { x: pts[lo].x + (pts[lo + 1].x - pts[lo].x) * fr, y: pts[lo].y + (pts[lo + 1].y - pts[lo].y) * fr };
    }
    function intersect(dx, dy){                          // 中心射线与折线求交，取最近的
      var best = null;
      for (var i = 0; i < N; i++){
        var ax = pts[i].x, ay = pts[i].y;
        var bx = pts[i + 1].x - ax, by = pts[i + 1].y - ay;
        var wx = ax - cx, wy = ay - cy;
        var den = dx * by - dy * bx;
        if (Math.abs(den) < 1e-12) continue;
        var t = (wx * by - wy * bx) / den;
        var u = (dy * wx - dx * wy) / den;
        if (t > 1e-6 && u >= -1e-9 && u <= 1 + 1e-9){
          if (!best || t < best.t) best = { t: t, u: u, i: i };
        }
      }
      if (!best) return { x: cx + dx, y: cy + dy, s: 0 };
      var seg = cum[best.i + 1] - cum[best.i];
      return { x: cx + dx * best.t, y: cy + dy * best.t, s: ((cum[best.i] + seg * best.u) % L + L) % L };
    }
    return { r: 0, L: L, pointAt: pointAt, intersect: intersect };
  }
  function pageBoundary(box, s){
    return makePtsBoundary(pagePts(box, s, 0), box.x + box.w / 2, box.y + box.h / 2);
  }

  // 轮廓峰值相对基础椭圆的外扩比例（1 = 无凸出）
  function wobbleMaxRatio(s){
    if (s.shape === 'rect' || s.shape === 'ellipse' || s.shape === 'page') return 1;
    var box = { x: 0, y: 0, w: 2, h: 2 };
    var f = s.shape === 'burst' ? burstField(box, s)
          : s.shape === 'cloud' ? cloudField(box, s)
          : wobblyField(box, s);
    return f.ratioMax || 1;                 // 各随机场都在构造时算好峰值
  }

  // 极坐标半径 → 顺时针折线点列；inset 为描边内缩量（沿径向收缩）
  function polarPts(f, N, inset){
    var pts = new Array(N + 1);
    for (var i = 0; i <= N; i++){
      var th = i * 2 * Math.PI / N;
      var r = Math.max(1, f.radius(th) - inset);
      pts[i] = { x: f.cx + r * Math.cos(th), y: f.cy + r * Math.sin(th) };
    }
    return pts;
  }

  // 折线边界（与 ellipseBoundary 相同的弧长参数化接口），供尾巴几何复用
  function polyBoundary(box, field){
    var f = field;
    var N = f.N || 720;
    var pts = polarPts(f, N, 0);
    var cum = new Array(N + 1); cum[0] = 0;
    for (var i = 1; i <= N; i++) cum[i] = cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    var L = cum[N];

    function pointAt(t){
      t = ((t % L) + L) % L;
      var lo = 0, hi = N;
      while (lo < hi){
        var mid = (lo + hi + 1) >> 1;
        if (cum[mid] <= t) lo = mid; else hi = mid - 1;
      }
      if (lo >= N) return { x: pts[N].x, y: pts[N].y };
      var seg = cum[lo + 1] - cum[lo];
      var fr = seg > 1e-12 ? (t - cum[lo]) / seg : 0;
      return { x: pts[lo].x + (pts[lo + 1].x - pts[lo].x) * fr, y: pts[lo].y + (pts[lo + 1].y - pts[lo].y) * fr };
    }

    function intersect(dx, dy){
      var th = Math.atan2(dy, dx);
      if (th < 0) th += 2 * Math.PI;
      var t = f.radius(th);
      var fi = th / (2 * Math.PI) * N;
      var i0 = Math.floor(fi) % N, i1 = (i0 + 1) % N, fr = fi - Math.floor(fi);
      var c0 = cum[i0], c1 = i1 === 0 ? L : cum[i1];
      return { x: f.cx + dx * t, y: f.cy + dy * t, s: ((c0 + (c1 - c0) * fr) % L + L) % L };
    }

    return { r: 0, L: L, pointAt: pointAt, intersect: intersect };
  }

  // 基点与根部两点都取真实边界上的点（按弧长偏移），保证尾巴与框贴合
  function tailGeom(box, s){
    if (!s.tailOn || s.tailLen <= 0 || s.tailWidth <= 0) return null;
    var a = s.tailAngle * Math.PI / 180;
    var dx = Math.cos(a), dy = Math.sin(a);
    var bd = boundaryOf(box, s);
    var P0 = bd.intersect(dx, dy);
    var half = s.tailWidth / 2;
    var sA = P0.s + half, sB = P0.s - half;      // A 在顺时针前方，B 在后方
    var A = bd.pointAt(sA), B = bd.pointAt(sB);
    if (s.tailShape === 'dots') return dotsTailGeom(box, s, bd, A, B, sA, sB, dx, dy);
    var T = { x: P0.x + dx * s.tailLen, y: P0.y + dy * s.tailLen };

    var curl = s.tailCurl * s.tailLen;
    var nx = -dy, ny = dx;
    var C1 = { x: A.x + dx * s.tailLen * 0.65 + nx * curl, y: A.y + dy * s.tailLen * 0.65 + ny * curl };
    var C2 = { x: B.x + dx * s.tailLen * 0.65 + nx * curl, y: B.y + dy * s.tailLen * 0.65 + ny * curl };

    var minX = Math.min(A.x, B.x, T.x, C1.x, C2.x), maxX = Math.max(A.x, B.x, T.x, C1.x, C2.x);
    var minY = Math.min(A.y, B.y, T.y, C1.y, C2.y), maxY = Math.max(A.y, B.y, T.y, C1.y, C2.y);

    return {
      bd: bd, sA: sA, sB: sB,
      A: A, B: B, T: T, C1: C1, C2: C2,
      outer: {
        l: Math.max(0, box.x - minX),
        t: Math.max(0, box.y - minY),
        r: Math.max(0, maxX - (box.x + box.w)),
        b: Math.max(0, maxY - (box.y + box.h))
      }
    };
  }

  // 半圆 + 圆点尾巴：主凸起是以根部开口 A、B 为直径的半圆（与气泡连通、根边开口），
  // 后面沿尾巴方向跟 2 个渐小的独立小圆（思考/云朵式）
  function dotsTailGeom(box, s, bd, A, B, sA, sB, dx, dy){
    var M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    var rc = Math.max(2, Math.hypot(A.x - B.x, A.y - B.y) / 2);   // 半圆半径 = 弦半长
    var angA = Math.atan2(A.y - M.y, A.x - M.x);
    var angB = Math.atan2(B.y - M.y, B.x - M.x);
    var TAU = Math.PI * 2;
    function norm(x){ x %= TAU; if (x < 0) x += TAU; return x; }
    // 弧从 B 画到 A，必须经过外侧（tailAngle 方向）而不是穿过气泡内部
    var cwDist = norm(s.tailAngle * Math.PI / 180 - angB);
    var ccw = norm(angB - s.tailAngle * Math.PI / 180) < cwDist;

    var r1 = rc * 0.42, r2 = rc * 0.26;
    var g = rc * 0.4 + s.tailLen * 0.3;
    var d1 = rc + g + r1;
    var d2 = d1 + r1 + g + r2;
    var dots = [
      { x: M.x + dx * d1, y: M.y + dy * d1, r: r1 },
      { x: M.x + dx * d2, y: M.y + dy * d2, r: r2 }
    ];

    var ex = [A, B,
      { x: M.x + dx * rc, y: M.y + dy * rc },                    // 半圆顶点
      { x: M.x - dx * rc, y: M.y - dy * rc },
      { x: M.x - dy * rc, y: M.y + dx * rc },
      { x: M.x + dy * rc, y: M.y - dx * rc }];
    dots.forEach(function(d){
      ex.push({ x: d.x - d.r, y: d.y - d.r }, { x: d.x + d.r, y: d.y + d.r });
    });
    var minX = -Infinity, maxX = Infinity, minY = -Infinity, maxY = Infinity;
    minX = maxX = ex[0].x; minY = maxY = ex[0].y;
    ex.forEach(function(p){
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    });

    return {
      bd: bd, sA: sA, sB: sB,
      A: A, B: B, C0: M, rc: rc, angA: angA, angB: angB, ccw: ccw, dots: dots,
      outer: {
        l: Math.max(0, box.x - minX),
        t: Math.max(0, box.y - minY),
        r: Math.max(0, maxX - (box.x + box.w)),
        b: Math.max(0, maxY - (box.y + box.h))
      }
    };
  }

  // extra：四周额外外扩（连框模式给外移描边留出线宽），W/H 随之加大、box 平移
  function computeGeometry(s, extra){
    extra = extra || 0;
    var m = measureCanvas();
    m.font = fontOf(s);
    var bw = s.borderWidth;
    var pad = s.padding;
    var lo, cw, ch, W, H, box, tg;

    // 椭圆/不规则/光球模式下，文字块（含内边距与边框）按 K 内接于基础椭圆
    var ell = s.shape !== 'rect' && s.shape !== 'page';
    var mr = ell ? wobbleMaxRatio(s) : 1;   // 轮廓峰值外扩比例（含在 K 中）
    var K = Math.SQRT2 * mr;

    if (s.autoSize){
      lo = layout(m, s, Infinity, Infinity);
      var cs = contentSize(lo, s);
      cw = cs.w; ch = cs.h;
      // 文字内接于缩小后的基础椭圆，轮廓峰值恰好贴住框边界，不会被画布裁掉
      // 书页模式：框 = 内容 + 边距，轮廓只向内波动，安全边距迭代收敛
      var boxW, boxH;
      if (s.shape === 'page'){
        var mg = 6;
        for (var pit = 0; pit < 3; pit++){
          boxW = Math.max(1, Math.round(cw + pad * 2 + bw * 2 + mg * 2));
          boxH = Math.max(1, Math.round(ch + pad * 2 + bw * 2 + mg * 2));
          mg = pageMargin(s, boxW, boxH);
        }
      } else if (ell){
        boxW = Math.max(1, Math.round(K * (cw + pad * 2 + bw * 2)));
        boxH = Math.max(1, Math.round(K * (ch + pad * 2 + bw * 2)));
      } else {
        boxW = Math.max(1, Math.round(cw + pad * 2 + bw * 2));
        boxH = Math.max(1, Math.round(ch + pad * 2 + bw * 2));
      }
      var probe = tailGeom({ x: 0, y: 0, w: boxW, h: boxH }, s);
      var out = probe ? probe.outer : { l: 0, t: 0, r: 0, b: 0 };
      // 四周留 bw/2 给描边外沿：有尾巴时描边沿轮廓中心线，会向外扩线宽的一半
      W = Math.max(1, Math.round(boxW + out.l + out.r + bw)) + extra * 2;
      H = Math.max(1, Math.round(boxH + out.t + out.b + bw)) + extra * 2;
      box = { x: out.l + bw / 2 + extra, y: out.t + bw / 2 + extra, w: boxW, h: boxH };
      tg = tailGeom(box, s);
    } else {
      W = Math.max(1, Math.round(s.width));
      H = Math.max(1, Math.round(s.height));
      var o = { l: 0, t: 0, r: 0, b: 0 };
      for (var it = 0; it < 3; it++){   // 尾巴外扩与框位置互相依赖，迭代收敛
        var aw = Math.max(1, (W - o.l - o.r - bw) / mr), ah = Math.max(1, (H - o.t - o.b - bw) / mr);
        box = { x: o.l + bw / 2 + (W - o.l - o.r - bw - aw) / 2,
                y: o.t + bw / 2 + (H - o.t - o.b - bw - ah) / 2, w: aw, h: ah };
        tg = tailGeom(box, s);
        if (!tg) break;
        o = tg.outer;
      }
      var aw2 = Math.max(1, (W - o.l - o.r - bw) / mr), ah2 = Math.max(1, (H - o.t - o.b - bw) / mr);
      box = { x: o.l + bw / 2 + (W - o.l - o.r - bw - aw2) / 2,
              y: o.t + bw / 2 + (H - o.t - o.b - bw - ah2) / 2, w: aw2, h: ah2 };
      if (extra){
        W += extra * 2; H += extra * 2;
        box = { x: box.x + extra, y: box.y + extra, w: box.w, h: box.h };
      }
      tg = tailGeom(box, s);
      cw = ell ? Math.max(0, box.w / K - bw * 2 - pad * 2)
             : s.shape === 'page'
               ? Math.max(0, box.w - bw * 2 - pad * 2 - pageMargin(s, box.w, box.h) * 2)
               : Math.max(0, box.w - bw * 2 - pad * 2);
      ch = ell ? Math.max(0, box.h / K - bw * 2 - pad * 2)
             : s.shape === 'page'
               ? Math.max(0, box.h - bw * 2 - pad * 2 - pageMargin(s, box.w, box.h) * 2)
               : Math.max(0, box.h - bw * 2 - pad * 2);
      lo = layout(m, s, cw, ch);
    }
    return { W: W, H: H, box: box, cw: cw, ch: ch, lo: lo, bw: bw, pad: pad, tail: tg };
  }

  // ---------- 绘制 ----------
  function rrPath(ctx, x, y, w, h, r){   // 只添加路径，不调用 beginPath
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 无尾巴时的框轮廓；inset 为描边内缩量（描边落在边界内侧）
  function shapePath(ctx, s, g, inset){
    var box = g.box;
    if (s.shape === 'ellipse'){
      ctx.ellipse(box.x + box.w / 2, box.y + box.h / 2,
                  Math.max(0.5, box.w / 2 - inset), Math.max(0.5, box.h / 2 - inset),
                  0, 0, Math.PI * 2);
    } else if (s.shape === 'page'){
      var pp = pagePts(box, s, inset);
      ctx.moveTo(pp[0].x, pp[0].y);
      for (var pi = 1; pi < pp.length; pi++) ctx.lineTo(pp[pi].x, pp[pi].y);
      ctx.closePath();
    } else if (s.shape === 'wobbly' || s.shape === 'burst' || s.shape === 'cloud'){
      var f = s.shape === 'burst' ? burstField(box, s)
            : s.shape === 'cloud' ? cloudField(box, s)
            : wobblyField(box, s);
      var pts = polarPts(f, f.N || 720, inset);
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
    } else {
      rrPath(ctx, box.x + inset, box.y + inset,
             Math.max(1, box.w - inset * 2), Math.max(1, box.h - inset * 2),
             Math.max(0, s.radius - inset));
    }
  }

  // 气泡整体轮廓：沿框边框顺时针绕行（跳过尾巴段），经尾巴 B→T→A 闭合。
  // 单一路径，fill / stroke 各一次：没有根边线，也没有穿过框内的内部线
  function bubblePath(ctx, s, g){
    var tg = g.tail, bd = tg.bd;
    var start = tg.sA;
    var end = tg.sB; if (end <= start) end += bd.L;
    var total = end - start;
    var p = bd.pointAt(start);
    ctx.moveTo(p.x, p.y);
    var steps = Math.max(8, Math.ceil(total / 2));   // 边界采样，弧线平滑
    for (var i = 1; i < steps; i++){
      var q = bd.pointAt(start + total * i / steps);
      ctx.lineTo(q.x, q.y);
    }
    var pB = bd.pointAt(tg.sB);
    ctx.lineTo(pB.x, pB.y);
    tailPart(ctx, s, tg, true);
    ctx.closePath();
  }

  // 尾巴段：从根部 B 出发、经尖端回到 A（不闭合），bubblePath 与半开描边共用
  // noMove=true 表示路径已落在 B 上（bubblePath 场景），避免断成两条子路径
  function tailPart(ctx, s, tg, noMove){
    if (!noMove) ctx.moveTo(tg.B.x, tg.B.y);
    if (s.tailShape === 'triangle'){
      ctx.lineTo(tg.T.x, tg.T.y);
      ctx.lineTo(tg.A.x, tg.A.y);
    } else if (s.tailShape === 'dots'){
      ctx.arc(tg.C0.x, tg.C0.y, tg.rc, tg.angB, tg.angA, tg.ccw);   // 半圆凸起，经外侧回到 A
    } else {
      ctx.quadraticCurveTo(tg.C2.x, tg.C2.y, tg.T.x, tg.T.y);
      ctx.quadraticCurveTo(tg.C1.x, tg.C1.y, tg.A.x, tg.A.y);
    }
  }

  // 光球「半开描边」：把轮廓按半径上升/下降切段，只保留上升侧 →
  // 每根刺一半有边框、一半空着，整体呈不闭合的手绘感；尾巴仍整段描
  function riseSegs(pts, cx, cy){
    var n = pts.length, i, j;
    var rs = new Array(n);
    for (i = 0; i < n; i++) rs[i] = Math.hypot(pts[i].x - cx, pts[i].y - cy);
    var K = 4, sm = new Array(n);          // 半径滑动平滑，避免采样噪声反复翻符号
    for (i = 0; i < n; i++){
      var acc = 0, cnt = 0;
      for (j = Math.max(0, i - K); j <= Math.min(n - 1, i + K); j++){ acc += rs[j]; cnt++; }
      sm[i] = acc / cnt;
    }
    var out = [], cur = [pts[0]], prev = 0;
    for (i = 1; i < n; i++){
      var dr = sm[i] - sm[i - 1];
      var sg = dr > 1e-9 ? 1 : (dr < -1e-9 ? -1 : 0);
      if (sg === 0) sg = prev || 1;
      if (prev && sg !== prev){
        if (prev > 0 && cur.length >= 3) out.push(cur);
        cur = [pts[i - 1]];
      }
      cur.push(pts[i]);
      prev = sg;
    }
    if (prev > 0 && cur.length >= 3) out.push(cur);
    return out;
  }
  // inset：描边路径内缩量（默认线宽/2）；strokeW：线宽（连框模式外移时传 2 倍线宽）
  function burstHalfStroke(ctx, s, g, inset, strokeW){
    var bw = g.bw, box = g.box;
    ctx.lineWidth = strokeW || bw;
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 8;
    ctx.strokeStyle = hexToRgba(s.borderColor, 1);
    var tg = g.tail;
    var cx = box.x + box.w / 2, cy = box.y + box.h / 2, pts;
    if (tg){
      var bd = tg.bd;
      var start = tg.sA, end = tg.sB; if (end <= start) end += bd.L;
      var total = end - start, steps = Math.max(8, Math.ceil(total / 2)), i;
      pts = [];
      for (i = 0; i <= steps; i++) pts.push(bd.pointAt(start + total * i / steps));
    } else {
      var f = burstField(box, s);
      pts = polarPts(f, f.N || 720, inset === undefined ? bw / 2 : inset);   // 默认描边内缩半个线宽
    }
    ctx.beginPath();
    var segs = riseSegs(pts, cx, cy);
    for (var a = 0; a < segs.length; a++){
      var sg = segs[a];
      ctx.moveTo(sg[0].x, sg[0].y);
      for (var b = 1; b < sg.length; b++) ctx.lineTo(sg[b].x, sg[b].y);
    }
    if (tg) tailPart(ctx, s, tg);
    ctx.stroke();
  }

  function hexToRgba(hex, a){
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // 竖排时需旋转的标点：句读点、括号、引号、破折号/省略号/间隔号，以及常见半角标点
  var ROT_PUNCT = /[，。、；：！？；：．·…～—－_,.;:!?~()\[\]{}<>「」『』【】〔〕（）〈〉《》]/;

  function draw(ctx, s, g, scale){
    var W = g.W, H = g.H, box = g.box;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = fontOf(s);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    frameFill(ctx, s, g);
    frameStroke(ctx, s, g);

    drawText(ctx, s, g);
  }

  // 填充框体：有尾巴时整体轮廓（根边开放）一次填充，圆点尾巴的小圆单独填充
  function frameFill(ctx, s, g){
    var box = g.box;
    if (s.bgTransparent) return;
    ctx.fillStyle = hexToRgba(s.bgColor, s.bgOpacity);
    ctx.beginPath();
    if (g.tail) bubblePath(ctx, s, g);
    else shapePath(ctx, s, g, 0);
    ctx.fill();
    if (g.tail && g.tail.dots){
      g.tail.dots.forEach(function(d){
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }
  // 描边框体：有尾巴时沿整体轮廓中心线，无尾巴时内缩线宽/2
  function frameStroke(ctx, s, g){
    if (!(g.bw > 0)) return;
    if (s.shape === 'burst' && s.spikeHalf){
      burstHalfStroke(ctx, s, g);           // 光球半开描边：只描每根刺的一侧
      return;
    }
    ctx.lineWidth = g.bw;
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 8;
    ctx.strokeStyle = hexToRgba(s.borderColor, 1);
    ctx.beginPath();
    if (g.tail) bubblePath(ctx, s, g);
    else shapePath(ctx, s, g, g.bw / 2);
    ctx.stroke();
    if (g.tail && g.tail.dots){
      g.tail.dots.forEach(function(d){
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.stroke();
      });
    }
  }
  // 连框模式专用：描边整体外移到轮廓外侧（线带占轮廓外 0～线宽）。
  // 配合「联合剪影擦除」，每条线的断口端面恰好贴合对方描边带的内缘 → 衔接无缝
  function frameStrokeOut(ctx, s, g){
    if (!(g.bw > 0)) return;
    var bw = g.bw;
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 8;
    ctx.strokeStyle = hexToRgba(s.borderColor, 1);
    if (s.shape === 'burst' && s.spikeHalf){
      burstHalfStroke(ctx, s, g, -bw / 2, bw * 2);   // 半开描边：路径外移 + 加宽，外半留在轮廓外
      return;
    }
    ctx.lineWidth = g.tail ? bw * 2 : bw;            // 尾巴沿中心线，加宽一倍让外半留在轮廓外
    ctx.beginPath();
    if (g.tail) bubblePath(ctx, s, g);
    else shapePath(ctx, s, g, -bw / 2);
    ctx.stroke();
    if (g.tail && g.tail.dots){
      ctx.lineWidth = bw;
      g.tail.dots.forEach(function(d){
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r + bw / 2, 0, Math.PI * 2);
        ctx.stroke();
      });
    }
  }
  // 文字绘制：内容区居中于框，支持横竖排与竖排标点旋转
  function drawText(ctx, s, g){
    var box = g.box;
    ctx.font = fontOf(s);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var ox = box.x + (box.w - g.cw) / 2;
    var oy = box.y + (box.h - g.ch) / 2;

    if (s.shadow){
      ctx.shadowColor = hexToRgba(s.shadowColor, .55);
      ctx.shadowBlur = s.shadowBlur;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = Math.max(1, s.shadowBlur / 4);
    } else {
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    }
    ctx.fillStyle = s.color;

    var lo = g.lo;
    if (s.direction === 'vertical'){
      var mainLen = lo.mainLen;
      var startX = s.alignH === 'left' ? ox :
                   s.alignH === 'right' ? ox + g.cw - mainLen :
                   ox + (g.cw - mainLen) / 2;
      var cols = lo.blocks;
      for (var i = 0; i < cols.length; i++){
        var blk = cols[i];
        var cx = s.colOrder === 'ltr'
          ? startX + (i + 0.5) * lo.step
          : startX + mainLen - (i + 0.5) * lo.step;
        var startY = s.alignV === 'top' ? oy :
                     s.alignV === 'bottom' ? oy + g.ch - blk.size :
                     oy + (g.ch - blk.size) / 2;
        var y = startY;
        for (var j = 0; j < blk.chars.length; j++){
          var it = blk.chars[j];
          var cy = y + (it.adv - s.letterSpacing) / 2;
          if (s.rotatePunct && ROT_PUNCT.test(it.ch)){
            // 顺时针旋转 90°，并把字形移到所在字格的右上象限（竖排标点位置），且保证不越出列宽
            var off = Math.min(s.fontSize * 0.24, Math.max(0, (lo.step - s.fontSize) * 0.5));
            ctx.save();
            ctx.translate(cx + off, cy - off);
            ctx.rotate(Math.PI / 2);
            ctx.fillText(it.ch, 0, 0);
            ctx.restore();
          } else {
            ctx.fillText(it.ch, cx, cy);
          }
          y += it.adv;
        }
      }
    } else {
      var startY2 = s.alignV === 'top' ? oy :
                   s.alignV === 'bottom' ? oy + g.ch - lo.mainLen :
                   oy + (g.ch - lo.mainLen) / 2;
      for (var k = 0; k < lo.blocks.length; k++){
        var line = lo.blocks[k];
        var lx = s.alignH === 'left' ? ox :
                 s.alignH === 'right' ? ox + g.cw - line.size :
                 ox + (g.cw - line.size) / 2;
        var cyy = startY2 + lo.step / 2;
        var x = lx;
        for (var t = 0; t < line.chars.length; t++){
          var c = line.chars[t];
          ctx.fillText(c.ch, x + (c.adv - s.letterSpacing) / 2, cyy);
          x += c.adv;
        }
        startY2 += line.chars.length === 0 ? lo.step * 0.6 : lo.step;
      }
    }

    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  }

  // ---------- 连框模式 ----------
  // 多个独立气泡放在同一画布上：每个框是完整的参数快照（形状/文字/尾巴/样式），
  // 重叠处无边框的实现：每个框的描边单独成层，用「其他框的填充形状」做蒙版擦掉
  // 落在别框内的部分——自家描边内半保留（线宽视觉不变），重叠区两家描边都消失
  var multi = { on: false, frames: [], act: 0 };
  var lastView = { W: 1, H: 1 };

  function multiItems(){
    return multi.frames.map(function(f){
      // extra = 线宽/2：连框描边整体外移到轮廓外，局部画布四周多留半条线
      return { s: f.st, g: computeGeometry(f.st, (f.st.borderWidth || 0) / 2), fx: f.fx, fy: f.fy };
    });
  }
  function multiSize(items){
    var W = 1, H = 1;
    items.forEach(function(it){
      W = Math.max(W, Math.ceil(it.fx + it.g.W));
      H = Math.max(H, Math.ceil(it.fy + it.g.H));
    });
    return { W: W, H: H };
  }
  // 预览专用：选中框的蓝色虚线标记（只画在预览画布上，导出不含）
  // 缩放手柄：右下角 = 等比缩放；四边中点 = 单轴拉伸（左/上拖动时对边固定，位置联动）
  function selHandlePts(it){
    var b = it.g.box, bw = it.g.bw || 0;
    var x0 = it.fx + b.x - bw, y0 = it.fy + b.y - bw;
    var x1 = x0 + b.w + bw * 2, y1 = y0 + b.h + bw * 2;
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return [
      { id: 'se', x: x1, y: y1, cursor: 'nwse-resize' },
      { id: 'e',  x: x1, y: cy, cursor: 'ew-resize' },
      { id: 'w',  x: x0, y: cy, cursor: 'ew-resize' },
      { id: 's',  x: cx, y: y1, cursor: 'ns-resize' },
      { id: 'n',  x: cx, y: y0, cursor: 'ns-resize' }
    ];
  }
  function drawSelBox(ctx, it, scale, W, H){
    var b = it.g.box, bw = it.g.bw || 0;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.strokeStyle = 'rgba(41,121,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    // 虚线框整体限制在画布内 1px：贴画布边的边若被裁掉一半，粗细会与其他边不一致
    var rx = it.fx + b.x - bw, ry = it.fy + b.y - bw;
    var x0 = Math.min(Math.max(rx, 1), (W || 1e9) - 1);
    var y0 = Math.min(Math.max(ry, 1), (H || 1e9) - 1);
    var x1 = Math.min(Math.max(rx + b.w + bw * 2, 1), (W || 1e9) - 1);
    var y1 = Math.min(Math.max(ry + b.h + bw * 2, 1), (H || 1e9) - 1);
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.setLineDash([]);
    selHandlePts(it).forEach(function(hd){
      // 手柄限制在画布内：框贴住画布边时圆点不会被裁掉一半（与命中检测共用同一 clamp）
      var x = Math.min(Math.max(hd.x, HANDLE_PAD), (W || 1e9) - HANDLE_PAD);
      var y = Math.min(Math.max(hd.y, HANDLE_PAD), (H || 1e9) - HANDLE_PAD);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(41,121,255,0.9)';
      ctx.stroke();
    });
  }
  // 连框渲染（联合外描边）：
  // 1) 所有框的描边画在轮廓外侧（frameStrokeOut）；
  // 2) 用所有框形状的联合剪影（不膨胀）擦掉落在联合体内部的描边；
  // 3) 每条描边的断口端面 = 联合体边界 = 对方描边带的内缘 → 衔接处严丝合缝，
  //    重叠区内部无线，透明背景（空心框）同样成立
  function drawMulti(ctx, items, W, H, scale){
    var pw = Math.max(1, Math.round(W * scale)), ph = Math.max(1, Math.round(H * scale));
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // 联合剪影 U（所有框的填充形状并集，含尾巴与圆点）
    var mk = document.createElement('canvas');
    mk.width = pw; mk.height = ph;
    var mc = mk.getContext('2d');
    mc.setTransform(scale, 0, 0, scale, 0, 0);
    mc.fillStyle = '#000';
    items.forEach(function(it){
      mc.save(); mc.translate(it.fx, it.fy);
      mc.beginPath();
      if (it.g.tail) bubblePath(mc, it.s, it.g);
      else shapePath(mc, it.s, it.g, 0);
      mc.fill();
      if (it.g.tail && it.g.tail.dots){
        it.g.tail.dots.forEach(function(d){
          mc.beginPath(); mc.arc(d.x, d.y, d.r, 0, Math.PI * 2); mc.fill();
        });
      }
      mc.restore();
    });
    // 填充层：先画所有框的填充（重叠区自然连通）
    items.forEach(function(it){
      ctx.save(); ctx.translate(it.fx, it.fy);
      frameFill(ctx, it.s, it.g);
      ctx.restore();
    });
    // 描边：逐框外移描边 → 擦掉联合体内部 → 合成
    items.forEach(function(it){
      var sl = document.createElement('canvas');
      sl.width = pw; sl.height = ph;
      var sc = sl.getContext('2d');
      sc.setTransform(scale, 0, 0, scale, 0, 0);
      sc.translate(it.fx, it.fy);
      frameStrokeOut(sc, it.s, it.g);
      sc.setTransform(1, 0, 0, 1, 0, 0);
      sc.globalCompositeOperation = 'destination-out';
      sc.drawImage(mk, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(sl, 0, 0);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    });
    // 文字最上层
    items.forEach(function(it){
      ctx.save(); ctx.translate(it.fx, it.fy);
      drawText(ctx, it.s, it.g);
      ctx.restore();
    });
  }
  function refreshFrameSel(){
    var sel = $('frameSel');
    sel.innerHTML = '';
    multi.frames.forEach(function(f, i){
      var o = document.createElement('option');
      o.value = String(i);
      var t = String(f.st.text || '').replace(/\s+/g, ' ').trim().slice(0, 8);
      o.textContent = '框 ' + (i + 1) + (t ? '：' + t : '');
      sel.appendChild(o);
    });
    sel.value = String(multi.act);
  }
  // state() 快照里已除以 100 的滑杆，恢复控件时乘回去

    var nm = st.fontFamily ? String(st.fontFamily).replace(/^"|"$/g, '') : '';

  function render(preItems){

      var f = multi.frames[multi.act];
      if (preItems && preItems.length){

        // 注意不能只判 truthy——事件监听直接绑 render 时，浏览器会把事件对象当首参传入
        var cur = preItems[multi.act];

        f.fx = Math.round(num('frameX'));
        f.fy = Math.round(num('frameY'));

      var items = preItems || multiItems();
      var sz = multiSize(items);
      W = sz.W; H = sz.H;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px';
      drawMulti(cv.getContext('2d'), items, W, H, dpr);
      if (selBoxOn) drawSelBox(cv.getContext('2d'), items[multi.act], dpr, W, H);
    } else {
      var s = state();
      var g = computeGeometry(s);
      W = g.W; H = g.H;

      cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; // 高度交给 CSS height:auto，缩放时保持比例

      c.height = Math.round(sz.H * scale);
      drawMulti(c.getContext('2d'), items, sz.W, sz.H, scale);
    } else {
      var s = state();
      var g = computeGeometry(s);
      c.width = Math.round(g.W * scale);
      c.height = Math.round(g.H * scale);
      draw(c.getContext('2d'), s, g, scale);

  function canvasPt(e){
    var r = cv.getBoundingClientRect();
    return {

      y: (e.clientY - r.top) * (lastView.H / (r.height || 1))

  function framePath2D(s, g){
    var p = new Path2D();
    if (g.tail) bubblePath(p, s, g);
    else shapePath(p, s, g, 0);
    if (g.tail && g.tail.dots){
      g.tail.dots.forEach(function(d){
        p.moveTo(d.x + d.r, d.y);
        p.arc(d.x, d.y, d.r, 0, Math.PI * 2);

    var items = preItems || multiItems();
    for (var i = items.length - 1; i >= 0; i--){

      hitCtx.translate(it.fx, it.fy);
      var ok = hitCtx.isPointInPath(framePath2D(it.s, it.g), x, y);
      hitCtx.restore();
      if (ok) return i;

  var HANDLE_R = 10;                                     // 手柄命中半径（画布像素）

  function handleHit(x, y, it){                          // 命中的手柄（含画布内 clamp），绘制与命中共用
    var best = null, bestD = HANDLE_R;

      var hx = Math.min(Math.max(hd.x, HANDLE_PAD), (lastView.W || 1e9) - HANDLE_PAD);
      var hy = Math.min(Math.max(hd.y, HANDLE_PAD), (lastView.H || 1e9) - HANDLE_PAD);

        var dx = (p.x - dragSt.px0) / Math.max(1, dragSt.w0);
        var dy = (p.y - dragSt.py0) / Math.max(1, dragSt.h0);
        var kx = null, ky = null;
        if (hd === 'se'){ var k = 1 + Math.max(dx, dy); kx = k; ky = k; }   // 角点：等比

        if (ky !== null){
          ky = Math.min(10, Math.max((16 + ex2) / Math.max(1, dragSt.h0), ky));
          var nh = Math.max(16, Math.round(dragSt.h0 * ky - ex2));
          if (isMulti) fr.st.height = nh;
          if (hd === 'n' && isMulti) fr.fy = Math.round(dragSt.fy0 + dragSt.h0 - (nh + bw2));  // 下缘固定
          $('height').value = nh;
        }
        if (isMulti){
          $('frameX').value = fr.fx;
          $('frameY').value = fr.fy;

        return;

  function syncMode(){
    var auto = $('autoSize').checked;

    $('rowColOrder').style.display = vert ? '' : 'none';

    var wob = shapeV === 'wobbly', burst = shapeV === 'burst', cloud = shapeV === 'cloud', page = shapeV === 'page';
    $('rowRadius').style.display = (shapeV === 'rect') ? '' : 'none';
    $('rowWobble').style.display = (wob || burst || cloud || page) ? '' : 'none';
    $('rowWobble').querySelector('label').textContent = burst ? '尖刺长' : cloud ? '云朵大小' : page ? '纸边波动' : '波动';
    $('rowSpikes').style.display = (wob || burst || cloud || page) ? '' : 'none';
    $('rowSpikes').querySelector('label').textContent = burst ? '尖刺数' : cloud ? '云朵数' : page ? '抖动密度' : '尖角';
    $('spikeDir').style.display = (cloud || page) ? 'none' : '';   // 云朵/书页没有凹凸方向

  }

  // ---------- 模板：把当前全部参数存起来，随时一键套用 ----------
  // 自动收集所有带 id 的设置控件（排除文字内容与字体文件），新增控件无需改这里
  var TPL_KEY = 'btg-templates';
  function tplIds(){
    return Array.prototype.slice.call(document.querySelectorAll('input[id],select[id],textarea[id]'))
      .filter(function(el){
        return el.id !== 'text' && el.id !== 'tplName' && el.type !== 'file' &&
               ['multiOn', 'frameSel', 'btnFrameAdd', 'btnFrameDel', 'frameX', 'frameY'].indexOf(el.id) < 0;
      })
      .map(function(el){ return el.id; });
  }
  function tplValues(){
    var o = {};
    tplIds().forEach(function(id){
      var el = $(id);
      o[id] = (el.type === 'checkbox' || el.type === 'radio') ? !!el.checked : el.value;
    });
    o.__direction = radio('direction');   // 排列方向（无 id，单独记）
    o.__seed = wobbleSeed;                // 不规则 / 光球尖刺的随机样式
    o.__font = customFontName || '';      // 上传的自定字体名（仅记录，用于提示）
    return o;
  }
  function tplLoad(){
    try { return JSON.parse(localStorage.getItem(TPL_KEY) || '[]'); } catch (e) { return []; }
  }
  function tplStore(list){
    try { localStorage.setItem(TPL_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function tplRefresh(){
    var list = tplLoad(), sel = $('tplList');
    sel.innerHTML = '';
    var none = document.createElement('option');
    none.value = ''; none.textContent = list.length ? '（选择模板）' : '（暂无模板）';
    sel.appendChild(none);
    list.forEach(function(t, i){
      var o = document.createElement('option');
      o.value = String(i); o.textContent = t.name;
      sel.appendChild(o);
    });
  }
  function tplApply(vals){
    tplIds().forEach(function(id){
      if (!(id in vals)) return;
      var el = $(id);
      if (el.type === 'checkbox') el.checked = !!vals[id];
      else el.value = vals[id];
    });
    if (vals.__direction){
      var rs = document.getElementsByName('direction');
      for (var i = 0; i < rs.length; i++) rs[i].checked = (rs[i].value === vals.__direction);
    }
    if (typeof vals.__seed === 'number') wobbleSeed = vals.__seed >>> 0;
    var nm = ($('fontFamily').value || '').replace(/^"|"$/g, '');
    customFontName = userFonts[nm] ? nm : null;
    Object.keys(syncFns).forEach(function(k){ syncFns[k](); });  // 刷新滑块数值显示
    syncMode();                                                  // 刷新行显隐 / 尖刺上限
    render();
  }

  $('tplList').addEventListener('change', function(){
    var list = tplLoad(), i = parseInt(this.value, 10);
    if (!isNaN(i) && list[i]) $('tplName').value = list[i].name;
  });

  $('btnTplSave').addEventListener('click', function(){
    var name = ($('tplName').value || '').trim() || ('模板 ' + (tplLoad().length + 1));
    var list = tplLoad();
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].name === name) idx = i;
    var item = { name: name, values: tplValues() };
    if (idx >= 0) list[idx] = item; else { list.push(item); idx = list.length - 1; }
    tplStore(list);
    tplRefresh();
    $('tplList').value = String(idx);
    msg('已保存模板：' + name);
  });

  $('btnTplApply').addEventListener('click', function(){
    var list = tplLoad(), i = parseInt($('tplList').value, 10);
    if (isNaN(i) || !list[i]){ msg('请先选择一个模板'); return; }
    tplApply(list[i].values);
    var tf = list[i].values.__font;
    if (tf && !userFonts[tf]) msg('已应用：' + list[i].name + '（该模板用的上传字体「' + tf + '」不在本机，需重新上传）');
    else msg('已应用模板：' + list[i].name);
  });

  $('btnTplDel').addEventListener('click', function(){
    var list = tplLoad(), i = parseInt($('tplList').value, 10);
    if (isNaN(i) || !list[i]){ msg('请先选择一个模板'); return; }
    if (!window.confirm('删除模板「' + list[i].name + '」？')) return;
    list.splice(i, 1);
    tplStore(list);
    tplRefresh();
    msg('已删除模板');
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  syncMode();
  tplRefresh();
  render();

  // 恢复上次上传的字体（并自动选中上次使用的字体）
  fontRestore().then(function(n){
    if (n) msg('已恢复 ' + n + ' 个上传字体');
    render();
  });
})();
</script>
</body>
</html>
